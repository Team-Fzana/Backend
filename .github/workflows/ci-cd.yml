# second instance
name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Log in to Docker Hub
    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # Build and Push Docker Image
    - name: Build and Push Docker Image
      working-directory: ./fzana
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/fzana-app:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/fzana-app:latest

    # .env 파일 생성 단계
    - name: Create .env File
      run: |
        echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
        echo "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" >> .env
        echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" >> .env
        echo "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}" >> .env
        echo "MYSQL_USER=root" >> .env
        echo "MYSQL_ROOT_PASSWORD=12345678" >> .env
    
    # Transfer Docker Compose File to EC2
    - name: Transfer Docker Compose to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        source: |
          ./fzana/docker-compose.yml
        target: ~/Backend/siso/

    # Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        debug: true
        script: |
          # Docker 이미지 업데이트 및 애플리케이션 실행
          cd ~/Backend/siso/fzana
          docker pull ${{ secrets.DOCKER_USERNAME }}/fzana-app:latest
          docker rm -f mysql-siso || true
          docker-compose down
          docker-compose up --build -d

