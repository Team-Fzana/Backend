name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Log in to Docker Hub
    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 3. Build and Push Docker Image
    - name: Build and Push Docker Image
      working-directory: ./fzana
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/fzana-app:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/fzana-app:latest

    # 4. Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/fzana-app:latest
          cd ~/Backend/fzana
          docker-compose down
          docker-compose up -d
